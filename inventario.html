<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - Leitor EAN</title>
    <!-- Leitor de Câmera -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Leitor de Arquivo CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f5f9; color: #333; text-align: center; padding: 20px; }
        h1 { color: #1c4966; font-size: 1.8rem;}
        #leitor-container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        #status-banco { margin-bottom: 20px; color: #666; font-size: 0.9rem; font-weight: bold; }
        #resultado { margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #4caf50; border-radius: 8px; font-size: 1.1rem; display: none; text-align: center; max-width: 500px; margin: 20px auto;}
        .erro { background: #ffebee !important; border-color: #f44336 !important; color: #d32f2f; text-align: center !important;}
        .destaque-nome { font-size: 1.3rem; font-weight: bold; color: #1c4966; margin: 15px 0;}
    </style>
</head>
<body>

    <h1>📦 Meu Inventário</h1>
    <div id="status-banco">⏳ Carregando base de dados...</div>

    <div id="leitor-container">
        <div id="reader"></div>
    </div>

    <div id="resultado"></div>

    <script>
        let baseDeProdutos = {};

        // 1. O sistema lê o seu arquivo CSV automaticamente
        Papa.parse("estoque.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(linha => {
                    // Agora o sistema é flexível: busca a coluna independente de como foi escrita!
                    let eanProduto = linha.EAN || linha.ean || linha.Ean || linha["Código EAN"] || linha["CÓDIGO EAN"];
                    let nomeProduto = linha.Nome || linha.NOME || linha.nome || linha["Descrição do material"] || linha["DESCRIÇÃO DO MATERIAL"] || linha.PRODUTO;
                    
                    if (eanProduto) {
                        baseDeProdutos[String(eanProduto).trim()] = nomeProduto || "Produto sem nome";
                    }
                });
                document.getElementById('status-banco').innerText = `✅ Banco carregado com sucesso!`;
                document.getElementById('status-banco').style.color = "green";
            },
            error: function() {
                document.getElementById('status-banco').innerText = "❌ Erro ao ler o arquivo estoque.csv";
                document.getElementById('status-banco').style.color = "red";
            }
        });

        // 2. Ação da câmera
        function aoEscanearComSucesso(codigoLido) {
            let areaResultado = document.getElementById('resultado');
            areaResultado.style.display = 'block';

            if (baseDeProdutos[codigoLido]) {
                areaResultado.className = '';
                areaResultado.innerHTML = `
                    <div>✅ <strong>Identificado:</strong></div>
                    <div class="destaque-nome">${baseDeProdutos[codigoLido]}</div>
                    <small style="color: #666;">EAN: ${codigoLido}</small>
                `;
            } else {
                areaResultado.className = 'erro';
                areaResultado.innerHTML = `<strong>❌ Não encontrado!</strong><br>O código ${codigoLido} não está na planilha.`;
            }
        }

        // 3. Liga a câmera
        let leitorHtml5 = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: { width: 250, height: 100 } },
            false
        );
        leitorHtml5.render(aoEscanearComSucesso);
    </script>
</body>
</html>
